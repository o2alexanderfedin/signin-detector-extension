name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Privacy audit
        run: npm run audit:privacy

      - name: Build (Chrome MV3)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox
