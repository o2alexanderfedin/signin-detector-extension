name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck · Lint · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what release.yml builds with; 25 is current Node, where the
        # test environment broke without anyone seeing it in CI.
        node: [22, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Privacy audit
        run: npm run audit:privacy

      - name: Build (Chrome MV3)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox
